[project]
name = "gummy-os-backend"
version = "0.1.0"
description = "GUMMY OS backend — memory engine & agent runtime (Phase 1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GUMMY OS" }]

# Runtime dependencies. Day 1 needs the web + config + (optional) DB-readiness
# stack only; pgvector, anthropic, alembic, etc. are added on the days they land.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.13",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "langfuse>=4.0,<5.0",
    # M6 Files System: multipart uploads + lazy-imported text extractors.
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Heavy ML stack for the real Hugging Face embedding provider. Kept optional so
# the core app/tests stay lightweight; install with `uv sync --extra embeddings`.
embeddings = [
    "sentence-transformers>=3.0",
]
# GPU power sampling for energy/cost accounting. Optional because the feature
# degrades to token-only accounting without it rather than failing, and
# because the package is meaningless on a machine with no NVIDIA card.
# Install with `uv sync --extra energy`.
energy = [
    "nvidia-ml-py>=12.560",
]
dev = [
    "ruff>=0.7",
    # Pinned, not floating. A formatter's output is a CI gate, so an open
    # bound means a new release silently reformats untouched files and turns
    # main red with no commit to blame. Bump it deliberately, in its own
    # commit, with the reformat it causes.
    "black==26.5.1",
    "mypy>=1.13",
    # Upper bounds, not just floors. A fresh `uv sync` resolved pytest 9 and
    # pytest-asyncio 1.x, and 1.x is a rewrite of event-loop and fixture
    # scoping that hangs this suite's async database tests outright — with no
    # commit to blame, because nothing in the repo changed. Test tooling is a
    # CI gate like the formatters, so it gets the same treatment: bump
    # deliberately, in its own commit, with whatever fallout that causes.
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Tooling (matches CONVENTIONS.md §7 and the root CI workflow) ──────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conftest sets test-isolation env vars before importing the app (intentional).
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12071f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Glow orbs -->
  <circle cx="200" cy="180" r="200" fill="#6366f1" opacity="0.08" filter="url(#blur)" />
  <circle cx="1100" cy="460" r="250" fill="#06b6d4" opacity="0.07" filter="url(#blur)" />
  <circle cx="640" cy="320" r="300" fill="#8b5cf6" opacity="0.05" filter="url(#blur)" />

  <!-- Grid lines -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)" />

  <!-- Brain icon (simplified SVG brain) -->
  <g transform="translate(100, 220)" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9">
    <ellipse cx="60" cy="50" rx="55" ry="45" />
    <path d="M60 5 C80 5 105 20 105 50 C105 80 85 90 60 95 C35 90 15 80 15 50 C15 20 40 5 60 5Z" />
    <line x1="60" y1="5" x2="60" y2="95" stroke-dasharray="4,3" opacity="0.5" />
    <path d="M15 50 Q30 35 45 50 Q60 65 75 50 Q90 35 105 50" />
    <circle cx="38" cy="30" r="4" fill="#8b5cf6" stroke="none" />
    <circle cx="82" cy="30" r="4" fill="#06b6d4" stroke="none" />
    <circle cx="25" cy="55" r="3" fill="#6366f1" stroke="none" />
    <circle cx="95" cy="55" r="3" fill="#6366f1" stroke="none" />
  </g>

  <!-- Main title -->
  <text x="260" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#accent)" filter="url(#textglow)">GUMMY OS</text>

  <!-- Subtitle -->
  <text x="262" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#a5b4fc" letter-spacing="2">Memory-First AI Operating System</text>

  <!-- Divider -->
  <rect x="262" y="278" width="640" height="2" fill="url(#accent)" opacity="0.6" />

  <!-- Description -->
  <text x="262" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Personal AI that remembers everything about you — across sessions, forever.</text>

  <!-- Tech pills -->
  <!-- FastAPI -->
  <rect x="262" y="360" width="110" height="34" rx="17" fill="#009688" opacity="0.25" />
  <rect x="262" y="360" width="110" height="34" rx="17" fill="none" stroke="#009688" stroke-width="1" />
  <text x="317" y="382" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4db6ac" text-anchor="middle">FastAPI</text>

  <!-- Next.js -->
  <rect x="382" y="360" width="110" height="34" rx="17" fill="#ffffff" opacity="0.08" />
  <rect x="382" y="360" width="110" height="34" rx="17" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <text x="437" y="382" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Next.js 16</text>

  <!-- PostgreSQL -->
  <rect x="502" y="360" width="130" height="34" rx="17" fill="#336791" opacity="0.25" />
  <rect x="502" y="360" width="130" height="34" rx="17" fill="none" stroke="#336791" stroke-width="1" />
  <text x="567" y="382" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#63b3ed" text-anchor="middle">PostgreSQL</text>

  <!-- Supabase -->
  <rect x="642" y="360" width="110" height="34" rx="17" fill="#3ecf8e" opacity="0.15" />
  <rect x="642" y="360" width="110" height="34" rx="17" fill="none" stroke="#3ecf8e" stroke-width="1" opacity="0.5" />
  <text x="697" y="382" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#3ecf8e" text-anchor="middle">Supabase</text>

  <!-- pgvector -->
  <rect x="762" y="360" width="110" height="34" rx="17" fill="#8b5cf6" opacity="0.2" />
  <rect x="762" y="360" width="110" height="34" rx="17" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5" />
  <text x="817" y="382" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle">pgvector</text>

  <!-- Feature tags -->
  <text x="262" y="440" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">• Agentic AI • Multi-Agent Orchestration • Semantic Search • 598 Tests • MIT License</text>

  <!-- URL -->
  <text x="262" y="490" font-family="system-ui, monospace, sans-serif" font-size="18" fill="#6366f1" opacity="0.8">gummy-os.vercel.app</text>

  <!-- Bottom dots decoration -->
  <g fill="#6366f1" opacity="0.4">
    <circle cx="262" cy="530" r="3" />
    <circle cx="278" cy="530" r="3" />
    <circle cx="294" cy="530" r="3" />
  </g>

  <!-- Version badge -->
  <rect x="1080" y="560" width="160" height="36" rx="18" fill="url(#glow)" stroke="#6366f1" stroke-width="1" opacity="0.8" />
  <text x="1160" y="583" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">v0.8.5 • Python 3.12</text>
</svg>

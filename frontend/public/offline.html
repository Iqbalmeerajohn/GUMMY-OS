<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1413" />
    <title>Offline · GUMMY</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1413;
        --fg: #e7f5ef;
        --muted: #8aa79b;
        --accent: #3fe0a0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .orb {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #bdffe2, #3fe0a0 42%, #0c7a52);
        opacity: 0.55;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 1px solid rgba(124, 255, 196, 0.35);
        background: rgba(63, 224, 160, 0.12);
        color: var(--accent);
        border-radius: 10px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: rgba(63, 224, 160, 0.2);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>GUMMY is unreachable</h1>
      <!--
        Deliberately specific. GUMMY runs on your own machine, so "offline"
        almost never means "the internet is down" — it means the phone cannot
        currently reach that machine. Saying so points at the real fix.
      -->
      <p>
        Your phone can’t reach the machine GUMMY runs on. Check that it’s
        awake, and that you’re on the same network or your tunnel is up.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
